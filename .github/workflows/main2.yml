name: Continuous 6-Hour Scraper

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-scraper] 
  # Uncomment the lines below if you just want GitHub to do it automatically every 6 hours without needing your API!
  # schedule:
  #   - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  poll-bms:
    runs-on: ubuntu-latest
    timeout-minutes: 360 
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Python Dependencies
        run: pip install requests curl-cffi

      - name: Configure Git User for Python Script
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global pull.rebase true

      - name: Install and Setup Cloudflare WARP
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install cloudflare-warp -y
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          sleep 5

      - name: Run Scraper Loop
        env:
          TG_BOT_TOKEN: ${{ vars.TG_BOT_TOKEN }}
          TG_GROUP_CHAT_ID: ${{ vars.TG_GROUP_CHAT_ID }}
        run: python -u seat_scraper.py
