name: Continuous 6-Hour Scraper

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-scraper] 
  # Uncomment the lines below if you just want GitHub to do it automatically every 6 hours without needing your API!
  # schedule:
  #   - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  poll-bms:
    runs-on: ubuntu-latest
    timeout-minutes: 360 
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Python Dependencies
        run: pip install requests curl-cffi qrcode[pil]

      - name: Configure Git User for Python Script
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global pull.rebase true

      - name: Install Cloudflare WARP (Fast & Safe)
        run: |
          # 1. Get OS codename
          CODENAME=$(lsb_release -cs)
          
          # 2. Find and download the newest .deb file directly
          DEB_PATH=$(curl -fsSL "https://pkg.cloudflareclient.com/dists/${CODENAME}/main/binary-amd64/Packages" | grep '^Filename:' | head -n 1 | awk '{print $2}')
          curl -fsSL -o warp.deb "https://pkg.cloudflareclient.com/$DEB_PATH"
          
          # 3. Install directly. If dependencies are missing, update the cache FIRST, then fix them.
          sudo dpkg -i warp.deb || { sudo apt-get update && sudo apt-get install -f -y; }
          
          # 4. Connect
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          sleep 2
      - name: Run Scraper Loop
        env:
          TG_BOT_TOKEN: ${{ vars.TG_BOT_TOKEN }}
          TG_GROUP_CHAT_ID: ${{ vars.TG_GROUP_CHAT_ID }}
          NTFY_ERROR_TOPIC: ${{ vars.NTFY_ERROR_TOPIC }}
          NTFY_SEAT_TOPIC: ${{ vars.NTFY_SEAT_TOPIC }}
          NTFY_URL: ${{ vars.NTFY_URL }}
          BMS_ID: ${{ vars.BMS_ID }}
          BMS_EMAIL: ${{ vars.BMS_EMAIL }}
          BMS_MOBILE: ${{ vars.BMS_MOBILE }}
        run: python -u seat_scraper.py
      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto-update state.json"
          file_pattern: "state.json"
